# Используется вместе с docker-compose.yml, который запускает PostgreSQL КР1.
services:
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hospital
      SPRING_DATASOURCE_USERNAME: hospital
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?set JWT_SECRET_BASE64}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080}
      PERMANENT_DELETE_ENABLED: ${PERMANENT_DELETE_ENABLED:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
